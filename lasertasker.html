// Priority config
function randomPriority() {
  const r = Math.random();
  if (r < 0.20) return { label: 'P1', color: '#FF4444', dot: '#FF0000' };
  if (r < 0.60) return { label: 'P2', color: '#FF8800', dot: '#FF6600' };
  return { label: 'P3', color: '#44BB44', dot: '#22AA22' };
}

// Shuffle helper
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let ticketPool = shuffle(TICKET_NAMES);
let ticketIndex = 0;

function nextTicket() {
  if (ticketIndex >= ticketPool.length) {
    ticketPool = shuffle(TICKET_NAMES);
    ticketIndex = 0;
  }
  return ticketPool[ticketIndex++];
}

// Spawn a task

  const priority = randomPriority();
  const speed = Math.min(400, 90 + (wave - 1) * 35);
  const name = nextTicket();

  tasks.push({
    x: x - 70, y: -80,
    w: 160, h: 60,
    speed,
    name,
    priority,
    id: Math.random()
  });

  leaderFlashTimer = 0.2;
}

// Shoot laser
function tryShoot() {
  if (state !== STATE.PLAYING) return;
  if (player.shootCooldown > 0) return;
  lasers.push({
    x: player.x + 35,
    y: player.y,
    w: 4,
    h: 18,
    speed: 600
  });
  player.shootCooldown = 0.25;
}

// Collision
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// Spawn explosion particles
function spawnExplosion(cx, cy) {
  const colors = ['#FF4444', '#FF8800', '#FFFF00', '#00FF88', '#FFFFFF', '#FF6600'];
  for (let i = 0; i < 14; i++) {
    const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.4;
    const speed = 60 + Math.random() * 120;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 0.6 + Math.random() * 0.4,
      maxLife: 0,
      r: 3 + Math.random() * 3
    });
    particles[particles.length - 1].maxLife = particles[particles.length - 1].life;
  }
}

// Trigger cry pause
function triggerCryPause() {
  state = STATE.CRY_PAUSE;
  cryTimer = CRY_DURATION;
  player.crying = true;
}

// Start / restart
function startOrRestart() {
  if (state === STATE.MENU || state === STATE.GAME_OVER) {
    state = STATE.PLAYING;
    score = 0;
    lives = 3;
    wave = 1;
    tasksDestroyed = 0;
    tasks = [];
    lasers = [];
    particles = [];
    player.x = 380;
    player.y = 530;
    player.shootCooldown = 0;
    player.crying = false;
    spawnTimer = 0;
    ticketPool = shuffle(TICKET_NAMES);
    ticketIndex = 0;
    waveBanner = { visible: false, timer: 0, wave: 1 };
  }
}

// Advance wave
function advanceWave() {
  wave++;
  waveBanner.visible = true;
  waveBanner.timer = 1.5;
  waveBanner.wave = wave;
}

// Fix: use waveBanner consistently
let waveB = { visible: false, timer: 0, wave: 1 };

// Input — keyboard
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); tryShoot(); }
  if (e.code === 'Enter') startOrRestart();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Convert client X to canvas-space X (handles CSS scaling on mobile)
function canvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (canvas.width / rect.width);
}

// Mouse controls
canvas.addEventListener('mousemove', e => {
  if (state === STATE.PLAYING) player.x = canvasX(e.clientX) - 18;
});
canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  if (state === STATE.PLAYING) tryShoot();
  else startOrRestart();
});

// Touch controls
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const tx = canvasX(e.touches[0].clientX);
  if (state === STATE.PLAYING) {
    player.x = tx - 18;
    tryShoot();
  } else {
    startOrRestart();
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state === STATE.PLAYING) player.x = canvasX(e.touches[0].clientX) - 18;
}, { passive: false });

// Update
function update(dt) {
  // Leader typing animation
  leaderTypingTimer += dt;
  if (leaderTypingTimer >= 0.8) {
    leaderTypingTimer = 0;
    leaderTypingDots = (leaderTypingDots + 1) % 4;
  }
  if (leaderFlashTimer > 0) leaderFlashTimer -= dt;

  // Wave banner
  if (waveB.visible) {
    waveB.timer -= dt;
    if (waveB.timer <= 0) waveB.visible = false;
  }

  if (state === STATE.PLAYING) {
    // Player movement
    const moveSpeed = 280;
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= moveSpeed * dt;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += moveSpeed * dt;
    player.x = Math.max(10, Math.min(750, player.x));

    // Shoot cooldown
    if (player.shootCooldown > 0) player.shootCooldown -= dt;

    // Spawn tasks
    const spawnInterval = Math.max(0.6, 3.0 - (wave - 1) * 0.2);
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnTask();
    }

    // Move tasks
    for (let i = tasks.length - 1; i >= 0; i--) {
      const t = tasks[i];
      t.y += t.speed * dt;

      if (t.y > 555) {
        tasks.splice(i, 1);
        triggerCryPause();
        return;
      }
    }

    // Move lasers
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      l.y -= l.speed * dt;
      if (l.y + l.h < 0) { lasers.splice(i, 1); continue; }

      // Collision with tasks
      let hit = false;
      for (let j = tasks.length - 1; j >= 0; j--) {
        const t = tasks[j];
        if (rectsOverlap(l.x, l.y, l.w, l.h, t.x, t.y, t.w, t.h)) {
          spawnExplosion(t.x + t.w / 2, t.y + t.h / 2);
          tasks.splice(j, 1);
          hit = true;
          score += 10 * wave;
          tasksDestroyed++;

          if (tasksDestroyed % 5 === 0) {
            wave++;
            waveB = { visible: true, timer: 1.5, wave };
          }
          break;
        }
      }
      if (hit) { lasers.splice(i, 1); }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 80 * dt; // slight gravity
    }

  } else if (state === STATE.CRY_PAUSE) {
    // Particles still animate during cry pause
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 80 * dt;
    }

    cryTimer -= dt;
    if (cryTimer <= 0) {
      lives--;
      tasks = [];
      lasers = [];
      player.crying = false;

      if (lives <= 0) {
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('lasertasker_hs', highScore);
        }
        state = STATE.GAME_OVER;
      } else {
        state = STATE.PLAYING;
      }
    }
  }
}

// Drawing helpers
function drawRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawTask(t) {
  // Card shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,82,204,0.5)';
  ctx.shadowBlur = 12;

  // Card body
  drawRoundRect(t.x, t.y, t.w, t.h, 6);
  ctx.fillStyle = '#0052CC';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();

  // Top bar (darker)
  ctx.save();
  ctx.beginPath();
  ctx.rect(t.x + 1.5, t.y + 1.5, t.w - 3, 16);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();

  // Priority dot
  ctx.beginPath();
  ctx.arc(t.x + 10, t.y + 10, 4, 0, Math.PI * 2);
  ctx.fillStyle = t.priority.dot;
  ctx.fill();

  // Priority label
  ctx.fillStyle = t.priority.color;
  ctx.font = 'bold 8px monospace';
  ctx.fillText(t.priority.label, t.x + 17, t.y + 13);

  // Ticket text (truncate to fit)
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 9px monospace';
  const maxW = t.w - 12;
  let name = t.name;
  // Fit text
  while (ctx.measureText(name).width > maxW && name.length > 4) {
    name = name.slice(0, -1);
  }
  if (name !== t.name) name = name.slice(0, -1) + '…';

  // Draw in two lines if needed
  const colonIdx = name.indexOf(':');
  if (colonIdx > 0) {
    const line1 = name.slice(0, colonIdx + 1);
    const line2 = name.slice(colonIdx + 2);
    ctx.fillText(line1, t.x + 6, t.y + 32);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '8px monospace';
    let l2 = line2;
    while (ctx.measureText(l2).width > maxW && l2.length > 4) l2 = l2.slice(0, -1);
    if (l2 !== line2) l2 = l2.slice(0, -1) + '…';
    ctx.fillText(l2, t.x + 6, t.y + 44);
  } else {
    ctx.fillText(name, t.x + 6, t.y + 38);
  }

  ctx.restore();
}

function drawLaser(l) {
  ctx.save();
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#00ff88';
  ctx.fillRect(l.x, l.y, l.w, l.h);
  // Bright core
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(l.x + 1, l.y, l.w - 2, l.h);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawLeader() {
  const lx = 400, ly = 20;

  // Flash overlay on monitor
  if (leaderFlashTimer > 0) {
    ctx.save();
    ctx.globalAlpha = leaderFlashTimer / 0.2 * 0.5;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(lx - 30, ly - 5, 60, 35);
    ctx.restore();
  }

  // Desk
  ctx.fillStyle = '#2d2d2d';
  ctx.fillRect(lx - 60, ly + 28, 120, 8);

  // Monitor
  ctx.fillStyle = '#1a1a2e';
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.fillRect(lx - 25, ly - 2, 50, 30);
  ctx.strokeRect(lx - 25, ly - 2, 50, 30);

  // Monitor glow (green/blue)
  ctx.save();
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#0d2a1a';
  ctx.fillRect(lx - 22, ly + 1, 44, 24);
  ctx.restore();

  // Monitor stand
  ctx.fillStyle = '#555';
  ctx.fillRect(lx - 3, ly + 28, 6, 6);

  // Boss emoji
  ctx.font = '28px serif';
  ctx.fillText('👨‍💼', lx - 14, ly + 26);

  // Typing dots
  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 10px monospace';
  const dots = '.'.repeat(leaderTypingDots);
  ctx.fillText(dots, lx + 16, ly + 18);

  // Label
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('TEAM LEAD', lx, ly + 48);
  ctx.textAlign = 'left';
}

function drawPlayer() {
  const px = player.x, py = player.y;

  if (player.crying) {
    // Desk
    ctx.fillStyle = '#3d2d1a';
    ctx.fillRect(px - 20, py + 26, 80, 10);

    // Player photo with red tint — circular clip
    ctx.save();
    ctx.beginPath();
    ctx.arc(px + 18, py + 18, 20, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if (playerImgLoaded) {
      ctx.drawImage(playerImg, px - 2, py - 2, 40, 40);
      ctx.fillStyle = 'rgba(180, 0, 0, 0.4)';
      ctx.fillRect(px - 2, py - 2, 40, 40);
    } else {
      ctx.fillStyle = '#552222';
      ctx.fill();
    }
    ctx.restore();

    // Red glowing border
    ctx.save();
    ctx.shadowColor = '#FF0000';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#FF4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px + 18, py + 18, 20, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Animated tears
    const tearWave = Math.sin(Date.now() / 120);
    ctx.save();
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#88ccff';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.moveTo(px + 11, py + 24);
    ctx.bezierCurveTo(px + 9 + tearWave, py + 30, px + 11, py + 34, px + 9 + tearWave, py + 40);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px + 25, py + 24);
    ctx.bezierCurveTo(px + 27 - tearWave, py + 30, px + 25, py + 34, px + 27 - tearWave, py + 40);
    ctx.stroke();
    ctx.restore();

    // Thought bubble
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeStyle = '#cccccc';
    ctx.lineWidth = 1.5;
    drawRoundRect(px + 42, py - 20, 160, 36, 10);
    ctx.fill();
    ctx.stroke();

    // Bubble tail dots
    const dots2 = [[px + 40, py + 4], [px + 36, py + 12], [px + 32, py + 18]];
    for (const [dx, dy] of dots2) {
      ctx.beginPath();
      ctx.arc(dx, dy, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    ctx.fillStyle = '#333';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('I should probably work', px + 48, py - 6);
    ctx.fillText('on this...', px + 48, py + 8);
    ctx.restore();

  } else {
    // Laser gun
    ctx.save();
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#00cc66';
    ctx.fillRect(px + 34, py, 6, 22);       // barrel
    ctx.fillStyle = '#009944';
    ctx.fillRect(px + 30, py + 18, 16, 10); // body
    ctx.restore();

    // Player photo — circular clipped portrait
    ctx.save();
    ctx.beginPath();
    ctx.arc(px + 18, py + 18, 20, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if (playerImgLoaded) {
      ctx.drawImage(playerImg, px - 2, py - 2, 40, 40);
    } else {
      ctx.fillStyle = '#888';
      ctx.fill();
    }
    ctx.restore();

    // Circle border with glow
    ctx.save();
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 8;
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px + 18, py + 18, 20, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawHUD() {
  // Score
  ctx.save();
  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 16px monospace';
  ctx.fillText(`AVOIDED: ${score}`, 12, 24);

  // Sprint
  ctx.fillStyle = '#88aaff';
  ctx.fillText(`SPRINT: ${wave}`, 12, 44);

  // Hearts (top right)
  ctx.font = '20px serif';
  let heartsX = 790;
  for (let i = 2; i >= 0; i--) {
    ctx.fillText(i < lives ? '❤️' : '🖤', heartsX - (2 - i) * 28, 24);
  }

  // High score
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`HI: ${highScore}`, 788, 44);
  ctx.textAlign = 'left';

  ctx.restore();
}

function drawFloor() {
  ctx.save();
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = 'rgba(255, 50, 50, 0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 558);
  ctx.lineTo(800, 558);
  ctx.stroke();
  ctx.setLineDash([]);

  // Floor label
  ctx.fillStyle = 'rgba(255,50,50,0.4)';
  ctx.font = '10px monospace';
  ctx.fillText('⚠ DEADLINE ZONE', 8, 572);
  ctx.restore();
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, 600);
  grad.addColorStop(0, '#0d1117');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 800, 600);

  // Subtle grid lines
  ctx.save();
  ctx.strokeStyle = 'rgba(0, 255, 136, 0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < 800; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 600); ctx.stroke();
  }
  for (let y = 0; y < 600; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke();
  }
  ctx.restore();
}

function drawMenu() {
  // Dim overlay
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, 800, 600);

  ctx.save();
  ctx.textAlign = 'center';

  // Title
  ctx.font = 'bold 54px monospace';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 24;
  ctx.fillStyle = '#00ff88';
  ctx.fillText('⚡ LASER TASKER', 400, 200);

  ctx.shadowBlur = 0;
  ctx.font = '20px monospace';
  ctx.fillStyle = '#88aaff';
  ctx.fillText('Defend your sprint from falling tickets!', 400, 250);

  ctx.font = '14px monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('← → Arrow Keys / Mouse / Touch to move', 400, 305);
  ctx.fillText('SPACE / Click / Tap to shoot', 400, 325);

  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 18px monospace';

  // Blinking press enter / tap
  if (Math.floor(Date.now() / 500) % 2 === 0) {
    ctx.fillText('[ PRESS ENTER OR TAP TO START ]', 400, 385);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '12px monospace';
  ctx.fillText(`BEST: ${highScore}`, 400, 430);

  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '12px monospace';
  ctx.fillText('Credit and Game concept goes to Yoav B 🎸', 400, 575);

  ctx.textAlign = 'left';
  ctx.restore();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, 800, 600);

  ctx.save();
  ctx.textAlign = 'center';

  ctx.font = 'bold 48px monospace';
  ctx.fillStyle = '#FF4444';
  ctx.shadowColor = '#FF4444';
  ctx.shadowBlur = 20;
  ctx.fillText('GAME OVER', 400, 190);

  ctx.shadowBlur = 0;
  ctx.font = '28px monospace';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(`Avoided Tasks: ${score}`, 400, 255);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('🏆 NEW HIGH SCORE! 🏆', 400, 295);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '18px monospace';
    ctx.fillText(`Best: ${highScore}`, 400, 295);
  }

  ctx.fillStyle = '#88aaff';
  ctx.font = '16px monospace';
  ctx.fillText(`Reached Sprint ${wave}    Destroyed ${tasksDestroyed} tasks`, 400, 340);

  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 18px monospace';
  if (Math.floor(Date.now() / 500) % 2 === 0) {
    ctx.fillText('[ PRESS ENTER OR TAP TO PLAY AGAIN ]', 400, 410);
  }

  ctx.textAlign = 'left';
  ctx.restore();
}

function drawWaveBanner() {
  if (!waveB.visible) return;
  const alpha = Math.min(1, waveB.timer / 0.3);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 260, 800, 80);

  ctx.textAlign = 'center';
  ctx.font = 'bold 36px monospace';
  ctx.shadowColor = '#88aaff';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#88aaff';
  ctx.fillText(`⚠ SPRINT ${waveB.wave} INCOMING ⚠`, 400, 308);
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawCryOverlay() {
  const alpha = 0.25 + 0.1 * Math.sin(Date.now() / 150);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FF0000';
  ctx.fillRect(0, 0, 800, 600);
  ctx.restore();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,100,100,0.9)';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('TASK LANDED! 😱', 400, 520);
  const remaining = Math.ceil(cryTimer);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '14px monospace';
  ctx.fillText(`Back in ${cryTimer.toFixed(1)}s...`, 400, 545);
  ctx.textAlign = 'left';
  ctx.restore();
}

// Main draw
function draw() {
  drawBackground();
  drawFloor();

  // Tasks
  for (const t of tasks) drawTask(t);

  // Lasers
  for (const l of lasers) drawLaser(l);

  // Leader
  drawLeader();

  // Player
  drawPlayer();

  // Particles
  drawParticles();

  // HUD
  drawHUD();

  // Wave banner
  drawWaveBanner();

  // State overlays
  if (state === STATE.MENU) drawMenu();
  else if (state === STATE.GAME_OVER) drawGameOver();
  else if (state === STATE.CRY_PAUSE) drawCryOverlay();
}

// Game loop
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(ts => { lastTime = ts; gameLoop(ts); });
</script>
